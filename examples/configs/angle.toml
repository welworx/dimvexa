# Your own angle names. `pi` is the number pi as a unit, so "2 pi" is an angle of 2*pi radians,
# and `turn` is a full revolution (2 pi). They are defined on `deg`, which is exactly pi/180 rad
# (ADR-018), so `2 pi` is exactly 360 deg and `1 turn` is exactly `2 pi rad`.
#
#   dimvexa convert 2 pi deg --config examples/configs/angle.toml
#   dimvexa convert 1 turn rad --config examples/configs/angle.toml
#   dimvexa convert 90 deg pi --config examples/configs/angle.toml
#
# Angle is dimensionless (ADR-007): `turn/s` is the same dimension as `Hz`, and 1 turn/s converts
# to 6.28 Hz, not to 1 Hz. That is why dimvexa ships neither `turn` nor `rev` nor `rpm`.

[[unit]]
symbol = "pi"
base = "deg"
factor = "180"
exactness = "defined"
prefixes = "none"
source = "BIPM SI Brochure, 9th ed. (2019), ch. 4, Table 8 (180 degrees = pi rad)"
note = "pi radian: 180 deg, exact because the degree is exactly pi/180 rad"

[[unit]]
symbol = "turn"
base = "deg"
factor = "360"
exactness = "defined"
prefixes = "none"
source = "ISO 80000-3:2019 (revolution = 2 pi rad = 360 degrees)"
note = "turn = 360 deg = 2 pi radian, exact"
