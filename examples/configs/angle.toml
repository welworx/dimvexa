# Your own angle names. `pirad` is the number pi as a unit, so "2 pirad" is an angle of 2*pi radians,
# and `turn` is a full revolution (2 pi). They are defined on `deg`, which is exactly pi/180 rad
# (ADR-018), so `2 pirad` is exactly 360 deg and `1 turn` is exactly `2 pi rad`.
#
#   dimvexa convert 2 pirad deg --config examples/configs/angle.toml
#   dimvexa convert 1 turn rad --config examples/configs/angle.toml
#   dimvexa convert 90 deg pirad --config examples/configs/angle.toml
#
# A constant's name is never also a unit's, so the unit is not called `pi` (the constant `pi`).
#
# Angle is dimensionless (ADR-007) but it is its own kind (ADR-020): `turn` takes the kind of
# `deg`, so `turn/s` converts to `rad/s` and to `1/s`, and `turn/s` to `Hz` is refused
# (`kind_mismatch`): 1 turn/s is 6.28 rad/s, while a cycle rate needs your own choice of 2 pi.
# That is why dimvexa ships neither `turn` nor `rev` nor `rpm`.

[[unit]]
id = "pirad"
base = "deg"
factor = "180"
exactness = "defined"
prefixes = "none"
source = "BIPM SI Brochure, 9th ed. (2019), ch. 4, Table 8 (180 degrees = pi rad)"
note = "pi radian: 180 deg, exact because the degree is exactly pi/180 rad"

[[unit]]
id = "turn"
base = "deg"
factor = "360"
exactness = "defined"
prefixes = "none"
source = "ISO 80000-3:2019 (revolution = 2 pi rad = 360 degrees)"
note = "turn = 360 deg = 2 pi radian, exact"
