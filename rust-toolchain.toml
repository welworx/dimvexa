# Pinned so that every contributor and every CI run builds with the same compiler. Move it
# forward deliberately (a pull request that bumps this line and fixes new lints); the nightly
# workflow builds and lints on the latest stable so drift shows up without turning main red.
# The minimum supported version (1.85) is tested separately in CI and is not set here.
[toolchain]
channel = "1.97.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
