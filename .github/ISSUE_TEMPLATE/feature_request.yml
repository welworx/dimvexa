name: Feature request
description: Suggest an API or tooling improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: correctness
    attributes:
      label: Does this risk a wrong or guessed conversion? How is that excluded?
