name: Feature request
description: Suggest an API, tooling or documentation improvement. (For a missing unit use "Unit request".)
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? Sketch the call or the command line.
    validations: { required: true }
  - type: textarea
    id: correctness
    attributes:
      label: Could this produce a wrong or guessed conversion? How is that excluded?
      description: Dimvexa does not guess (no equations of state, no density correlations, no silent defaults). Say how your proposal stays within that.
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: rules
    attributes:
      label: Checks
      options:
        - label: I read CONTRIBUTING.md and this does not need an equation of state, a density or an empirical formula.
          required: true
