# The pull request title becomes the squash-merge commit message and drives the changelog,
# so it must be a Conventional Commit: type(scope): subject.
#
# No third-party action and no pull_request_target: this is a plain shell check with read-only
# permissions. The title is attacker-controlled text, so it reaches the script only through an
# environment variable, never through ${{ }} interpolation into the script body.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "merge_group" ]; then
            echo "merge queue: the title was checked on the pull request"
            exit 0
          fi
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          pattern="^(${types})(\\([a-z0-9._/-]+\\))?!?: [^ ].{0,100}\$"
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "ok: $PR_TITLE"
          else
            echo "::error::The pull request title is not a Conventional Commit."
            echo "Expected: type(scope): subject   (types: ${types//|/, })"
            echo "Example:  feat(data): add ft_us_survey"
            echo "Got:      $PR_TITLE"
            exit 1
          fi
