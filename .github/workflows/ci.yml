# The CI pipeline. The heavy lifting is `cargo xtask ci`, the same command you run locally,
# so "green on my machine" and "green in CI" mean the same thing.
#
# Not yet executed on GitHub: this file was written without access to Actions. Expect small
# fixes on the first run. Third-party actions are pinned by commit SHA; read docs/ci-pinning.md
# before enabling, because the SHAs below were copied, not looked up.
#
# Branch protection: require ONLY the `ci-success` job. It aggregates every job below, so
# adding or renaming a job never needs a settings change.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only superseded pull request runs are cancelled; every push to main runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: check (fmt, clippy, tests, docs, data, example)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default "$v"
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo xtask ci (includes check-docs)
        run: cargo xtask ci

  test-os:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default "$v"
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo xtask ci test doctest example
        run: cargo xtask ci test doctest example

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 1.85 is the lowest version that supports edition 2024. Keep in step with
      # `rust-version` in Cargo.toml and `msrv` in clippy.toml.
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the MSRV toolchain
        # RUSTUP_TOOLCHAIN (job env) overrides rust-toolchain.toml for every step.
        run: rustup toolchain install 1.85 --profile minimal --no-self-update
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Show the compiler (must say 1.85)
        run: rustc -V && cargo -V
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked --profile ci

  wasm:
    name: wasm32 build of the core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain with the wasm target
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default "$v"
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build -p dimvexa-core --target wasm32-unknown-unknown --locked

  deny:
    name: cargo-deny (licenses, bans, sources, advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          # Pinned. Keep in step with .github/workflows/nightly.yml.
          tool: cargo-deny@0.18.3
      - run: cargo deny --locked check

  text:
    name: typos and TOML format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          # Not version-pinned (see docs/ci-pinning.md): pin them once you have chosen versions.
          tool: typos-cli,taplo-cli
      - run: typos
      - run: taplo fmt --check

  package:
    name: package (self-contained crates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default "$v"
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: List the files of every publishable crate
        run: |
          for c in dimvexa-core dimvexa-data dimvexa-config dimvexa dimvexa-cli; do
            echo "== $c"
            cargo package --list --package "$c" --locked
          done
      - name: The data crate carries its unit tables
        run: cargo xtask ci package
      - name: Dry-run publish of the leaf crate
        # Only dimvexa-core can be checked this way: the others depend on workspace crates
        # that are not on crates.io yet. Once core is published, extend this to the others
        # in dependency order (core, data, config, dimvexa, cli).
        run: cargo publish --dry-run --package dimvexa-core --locked

  workflows:
    name: workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          # Pinned. Unverified: confirm this release exists (docs/ci-pinning.md).
          tool: actionlint@1.7.7
      - run: actionlint

  # The only check branch protection needs. A needed job must have succeeded; "skipped" is
  # accepted only for jobs listed in ALLOW_SKIPPED (none today).
  ci-success:
    name: ci-success
    if: always()
    needs: [check, test-os, msrv, wasm, deny, text, package, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOW_SKIPPED: ""
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r --arg allow "$ALLOW_SKIPPED" '
            ($allow | split(",")) as $ok
            | to_entries[]
            | select(.value.result != "success"
                     and (.value.result != "skipped" or ([.key] | inside($ok) | not)))
            | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::not successful: $bad"
            exit 1
          fi
