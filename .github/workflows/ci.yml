# Untested in M0: this file could not be run from the authoring session (no GitHub Actions).
# TODO(owner): pin every third-party action by commit SHA (Dependabot keeps them current);
# the SHAs could not be looked up offline, so version tags are used for now.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          # MSRV. Edition 2024 needs at least 1.85; the value is declared in Cargo.toml
          # (rust-version) and was NOT verified by a build in M0 (only stable was installed).
          - { os: ubuntu-latest, toolchain: "1.85" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --all-features --doc
      - run: cargo test --workspace --no-default-features
      - run: cargo run --example pool_pump -p dimvexa

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p dimvexa-core --target wasm32-unknown-unknown

  minimal-versions:
    # The workspace has no external dependencies in M0, so this is trivially green; it
    # starts to matter when dependencies appear.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly update -Z direct-minimal-versions && cargo +nightly check --workspace --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  taplo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@taplo
      - run: taplo fmt --check

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask validate-data

  extras:
    # Network-only dev tooling (proptest, criterion, insta, assert_cmd, iai-callgrind).
    # Written in M0 without registry access, so this job is the first real compile of
    # extras/. Expect small fixes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extras
      - run: cargo test --manifest-path extras/Cargo.toml
      - run: cargo bench --manifest-path extras/Cargo.toml --no-run

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov -p dimvexa-core --all-features --fail-under-lines 90 --lcov --output-path lcov.info

  semver:
    # Enable after the first release exists (cargo-semver-checks needs a baseline).
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  bench-regression:
    # Deterministic instruction counts. Advisory in M0 (no stored baseline yet).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extras
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      # The runner version must match the iai-callgrind library version in extras/Cargo.toml.
      - run: cargo install iai-callgrind-runner --version 0.14.0 --locked
      - run: cargo bench --manifest-path extras/Cargo.toml --bench iai

  ci-success:
    if: always()
    needs: [fmt, clippy, test, docs, wasm, minimal-versions, deny, typos, taplo, data, extras, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require all needed jobs to succeed
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "\(failure\|cancelled\)"' && exit 1 || exit 0
