# The CI pipeline. The heavy lifting is `cargo xtask ci`, the same command you run locally,
# so "green on my machine" and "green in CI" mean the same thing.
#
# Not yet executed on GitHub: this file was written without access to Actions. Expect small
# fixes on the first run. Third-party actions are pinned by commit SHA; read docs/ci-pinning.md
# before enabling, because the SHAs below were copied, not looked up.
#
# Branch protection: require ONLY the `ci-success` job. It aggregates every job below, so
# adding or renaming a job never needs a settings change.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: check (fmt, clippy, tests, docs, data, example)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo xtask ci
        run: cargo xtask ci

  test-os:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo xtask ci test doctest example
        run: cargo xtask ci test doctest example

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 1.85 is the lowest version that supports edition 2024. Keep in step with
      # `rust-version` in Cargo.toml and `msrv` in clippy.toml.
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.85 --profile minimal --no-self-update
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo --version && rustc --version
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked --profile ci

  wasm:
    name: wasm32 build of the core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable toolchain with the wasm target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default stable
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p dimvexa-core --target wasm32-unknown-unknown --locked

  deny:
    name: cargo-deny (licenses, bans, sources, advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          # Pinned. Keep in step with .github/workflows/nightly.yml.
          tool: cargo-deny@0.18.3
      - run: cargo deny --locked check

  text:
    name: typos and TOML format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          # Not version-pinned (see docs/ci-pinning.md): pin them once you have chosen versions.
          tool: typos-cli,taplo-cli
      - run: typos
      - run: taplo fmt --check

  # The only check branch protection needs. It fails if any job above failed or was cancelled
  # and is the required status check for the merge queue as well.
  ci-success:
    name: ci-success
    if: always()
    needs: [check, test-os, msrv, wasm, deny, text]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
