# Developer Certificate of Origin: every commit in a pull request carries a Signed-off-by line
# (git commit -s). See CONTRIBUTING.md. The repository owner (welworx) is the sole maintainer
# and is exempt: pull requests authored by the owner skip the check, and coding agents working
# for the owner do not add sign-offs. Outside contributors are always checked. Read-only permissions, no third-party action, and
# never pull_request_target: the code of the pull request is only read as git history.
name: dco

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    # A skipped job counts as passing for branch protection. The login comes from the event
    # payload and is only compared here, never executed.
    if: github.event_name == 'merge_group' || github.event.pull_request.user.login != 'welworx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # copied from a widely used repo, verify against the action's release page before enabling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by on every commit
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "merge_group" ]; then
            echo "merge queue: commits were checked on the pull request"
            exit 0
          fi
          missing=0
          # Merge commits are skipped; so are commits authored by GitHub bots (Dependabot).
          for c in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            email=$(git show -s --format=%ae "$c")
            case "$email" in
              *"[bot]@users.noreply.github.com") continue ;;
            esac
            if ! git show -s --format=%B "$c" | grep -Eq '^Signed-off-by: .+ <[^<>]+@[^<>]+>[[:space:]]*$'; then
              echo "::error::commit $c has no Signed-off-by line (use: git commit -s --amend)"
              missing=1
            fi
          done
          exit $missing
