# Weekly mutation testing of the core: "would the tests notice if this line were changed?".
# Reporting only (continue-on-error); the result is an artifact to read, not a gate. Not yet
# executed on GitHub.
name: mutants

on:
  schedule:
    - cron: "23 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutants:
    name: cargo mutants -p dimvexa-core
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal --no-self-update
          rustup default "$v"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants
      - name: Run the mutants
        run: cargo mutants -p dimvexa-core --timeout 60 --no-shuffle
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore
          retention-days: 30
