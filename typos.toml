[default]
extend-ignore-re = [
    # Unit symbols that look like typos.
    "\\bBtu\\b",
    "\\bPa\\b",
    # Hex digests of f64 bit patterns in the benchmark corpus (letters like `ba` are not words).
    "\"expect_f64_bits\": \"[0-9a-f]+\"",
]

[default.extend-words]
# Unit symbols and names that are not typos.
ohm = "ohm"
tonne = "tonne"
nmi = "nmi"

[files]
extend-exclude = ["LICENSE-APACHE", "LICENSE-MIT", "Cargo.lock"]
