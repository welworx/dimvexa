# United States customary names. Nothing is guessed: each name points at one existing unit.
#
#   dimvexa convert 1 ton kg --config us-customary
#   dimvexa convert 1 gal L --config us-customary
#
# `oz` is not mapped: it is a mass (oz_av, oz_troy) or a volume (fl_oz_us) in the US as well.
# `dram` is not mapped: it is an avoirdupois mass (dram_av), an apothecaries mass (dram_ap) or a fluid dram
# (fl_dr_us). `chain`, `link`, `rod`, `furlong`, `fathom` and `cable` are not mapped either: the survey and
# the international foot differ (the survey foot was retired in 2023).
# `mile` is the international mile; the US survey mile stays available as mi_us_survey.

[map]
ton = "ton_short"
mile = "mi"
chain = "chain_int"
link = "link_int"
rod = "rod_int"
furlong = "furlong_int"
gal = "gal_us"
pt = "pt_us"
qt = "qt_us"
gill = "gill_us"
peck = "pk_us"
bushel = "bu_us"
minim = "minim_us"
cwt = "cwt_short"
