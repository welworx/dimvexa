# British (imperial) names. Nothing is guessed: each name points at one existing unit.
#
#   dimvexa convert 1 ton kg --config gb
#   dimvexa convert 1 gal L --config gb
#
# `oz` is not mapped: it is a mass (oz_av, oz_troy) or a volume (fl_oz_imp) in the UK as well.

[map]
ton = "ton_long"
mile = "mi"
gal = "gal_imp"
pt = "pt_imp"
qt = "qt_imp"
