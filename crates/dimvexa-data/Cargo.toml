[package]
name = "dimvexa-data"
description = "Unit tables for dimvexa, compiled from audited TOML. Exact factors. Loud failures. Zero guessing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
# Everything the crate needs is inside the crate directory, so the published package builds
# on its own: the unit tables, the golden vectors, the build script and its tiny TOML reader.
include = [
    "/src/**",
    "/tests/**",
    "/tooling/**",
    "/data/**",
    "/build.rs",
    "/README.md",
]

[dependencies]
dimvexa-core = { workspace = true }

[lints]
workspace = true
