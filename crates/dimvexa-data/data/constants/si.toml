# The defining constants of the SI that are not units themselves (BIPM SI Brochure, 9th ed.,
# 2019, ch. 2, Table 1). Since 2019 their values are exact by definition, so they are `defined`
# and need no CODATA edition. Format: see math.toml. A constant's name is never also a unit's
# (`h` is the hour), so the Planck constant is `planck_constant`. Constant ids say what they are
# (`elementary_charge`, not `e`): short symbols are for a user's own config.

[[constant]]
id = "planck_constant"
name = "Planck constant"
value = "662607015/1 10^-42"
unit = "J.s"
exactness = "defined"
conditions = "none (defined)"
source = "BIPM SI Brochure, 9th ed. (2019), ch. 2, Table 1 (defining constants): h = 6.626 070 15e-34 J s"
note = "exact by the 2019 SI redefinition"

[[constant]]
id = "elementary_charge"
name = "Elementary charge"
value = "1602176634/1 10^-28"
unit = "C"
exactness = "defined"
conditions = "none (defined)"
source = "BIPM SI Brochure, 9th ed. (2019), ch. 2, Table 1 (defining constants): e = 1.602 176 634e-19 C"
note = "exact by the 2019 SI redefinition"

[[constant]]
id = "boltzmann_constant"
name = "Boltzmann constant"
value = "1380649/1 10^-29"
unit = "J/K"
exactness = "defined"
conditions = "none (defined)"
source = "BIPM SI Brochure, 9th ed. (2019), ch. 2, Table 1 (defining constants): k = 1.380 649e-23 J/K"
note = "exact by the 2019 SI redefinition"

[[constant]]
id = "avogadro_constant"
name = "Avogadro constant"
value = "602214076/1 10^15"
unit = "1/mol"
exactness = "defined"
conditions = "none (defined)"
source = "BIPM SI Brochure, 9th ed. (2019), ch. 2, Table 1 (defining constants): avogadro_constant = 6.022 140 76e23 1/mol"
note = "exact by the 2019 SI redefinition"

[[constant]]
id = "speed_of_light"
name = "Speed of light in vacuum"
value = "299792458/1"
unit = "m/s"
exactness = "defined"
conditions = "none (defined)"
source = "BIPM SI Brochure, 9th ed. (2019), ch. 2, Table 1 (defining constants): c = 299 792 458 m s^-1"
note = "exact by the 1983 definition of the metre and the 2019 SI"

[[constant]]
id = "molar_gas_constant"
name = "Molar gas constant"
value = "831446261815324/1 10^-14"
unit = "J/(mol.K)"
exactness = "defined"
conditions = "none (defined)"
source = "R = avogadro_constant boltzmann_constant, the product of two defining constants (BIPM SI Brochure, 9th ed. (2019), ch. 2, Table 1): 6.022 140 76e23 1/mol x 1.380 649e-23 J/K = 8.314 462 618 153 24 J/(mol K)"
note = "exact: the product of the exact avogadro_constant and boltzmann_constant, 602214076 x 1380649 = 831446261815324"
