# SPDX-License-Identifier: MIT OR Apache-2.0
# Golden vectors for the common pack: value in `from` converts exactly to `expect` in `to`.
# `expect` is a fraction, an integer or a decimal. With `rel_tol` the comparison is approximate
# (used where the source publishes a rounded number). `source` says where the number comes from.

[[vector]]
unit = "bar"
value = "1"
from = "bar"
to = "kPa"
expect = "100"
source = "NIST SP 811 (2008), Appendix B (bar = 100 kPa)"

