# SPDX-License-Identifier: MIT OR Apache-2.0
# Golden vectors for the base pack: value in `from` converts exactly to `expect` in `to`.
# `expect` is a fraction, an integer or a decimal. With `rel_tol` the comparison is approximate
# (used where the source publishes a rounded number). `source` says where the number comes from.

[[vector]]
unit = "m"
value = "1"
from = "km"
to = "m"
expect = "1000"
source = "BIPM SI Brochure, 9th ed. (2019), SI prefixes (kilo = 10^3)"

[[vector]]
unit = "g"
value = "1"
from = "kg"
to = "g"
expect = "1000"
source = "BIPM SI Brochure, 9th ed. (2019), SI prefixes (kilo = 10^3); kg is the SI base unit"

[[vector]]
unit = "s"
