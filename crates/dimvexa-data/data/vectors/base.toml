value = "1"
from = "W/(m.K)"
to = "W/(m.delta_degC)"
expect = "1"
source = "BIPM SI Brochure, 9th ed. (2019): a temperature interval of 1 K equals 1 degC, so W/(m K) = W/(m degC); a K inside a compound unit is the interval kind"

