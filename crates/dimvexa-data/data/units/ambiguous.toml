# Bare symbols that are deliberately rejected. Each lists the explicit units to use instead.
# `planned` entries are not in the table yet; they are shown to the user with a (planned) mark.

[[ambiguous]]
symbol = "ton"
candidates = ["ton_short", "ton_long", "tonne"]
planned = []
note = "short ton (2000 lb), long ton (2240 lb) and metric tonne (1000 kg) are all called ton"

