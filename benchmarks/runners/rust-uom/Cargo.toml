# SPDX-License-Identifier: MIT OR Apache-2.0
# Benchmark runner for the Rust `uom` crate (compile-time units). Own workspace; needs the crates
# registry, so it is NOT built offline and NOT by the main CI. Build with --locked (Cargo.lock is
# committed).
[package]
name = "dimvexa-bench-uom"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
uom = "0.36"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
