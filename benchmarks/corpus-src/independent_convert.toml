# Independent must-convert cases (origin = "independent"). The expected value `expect` is the
# number as PUBLISHED in the cited source (an exact definition: NIST SP 811 App. B, BIPM SI
# Brochure, NIST HB 44), typed here as a decimal or fraction. It is NOT taken from Dimvexa's
# golden vectors or tables. gen_corpus.py additionally cross-checks each case against the
# oracle in truth.toml and fails on any disagreement, so an error in either list is caught.
# Only exact definitions are used; rounded table values would need a tolerance and are left out.
# Sources are cited, not copied: one fact per case. ind-029..038 come from the UCUM essence file, ind-039..041 from the mathjs and pint test suites (facts only).
# Not used: the astropy suite (see docs/benchmarks/honest-assessment.md).

[[case]]
id = "ind-001"
category = "independent"
value = "1"
from = "in"
to = "mm"
expect = "25.4"
source = "NIST SP 811 (2008) App. B.8: inch = 0.0254 m, exact (1959 international yard and pound agreement)"

