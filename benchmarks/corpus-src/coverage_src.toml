# SPDX-License-Identifier: MIT OR Apache-2.0
# Coverage lists: unit expressions a user of process engineering, science and everyday work
# expects to be understood. Neutral spelling (Dimvexa's); per-library spellings live in
# benchmarks/translations/. A library "covers" an entry if it can parse it into a unit.
# Dimvexa's own seed table is added automatically by gen_corpus.py as category
# "dimvexa_seed_table".

[[list]]
category = "si"
units = ["m", "kg", "s", "A", "K", "mol", "cd", "Hz", "N", "Pa", "J", "W", "C", "V", "ohm", "F", "S", "Wb", "T", "H", "L", "tonne", "min", "h", "d"]

[[list]]
category = "si_prefixed"
units = ["km", "mm", "um", "nm", "kPa", "MPa", "GPa", "kJ", "MJ", "GJ", "kW", "MW", "mL", "kmol", "mmol", "kWh", "MWh"]

[[list]]
category = "imperial_us"
units = ["in", "ft", "yd", "mi", "nmi", "lb", "oz_av", "oz_troy", "ton_short", "ton_long", "gal_us", "gal_imp", "pt_us", "pt_imp", "lbf", "Btu_IT", "Btu_th", "cal_th", "cal_IT", "hp_mech", "hp_metric", "ft_us_survey", "mi_us_survey", "bbl"]

[[list]]
category = "pressure"
units = ["bar", "atm", "psi", "mmHg", "torr", "barg", "psig", "kgf/cm2", "inHg", "mH2O"]

[[list]]
category = "process"
units = ["kmol/h", "lbmol/h", "cP", "cSt", "W/(m.K)", "kJ/(kg.K)", "Btu_IT/(lb.delta_degF)", "Nm3", "Nm3/h", "scf", "scf/min", "bbl/d", "mol/s", "m3/h", "kg/h", "lb/h", "gal_us/min", "kg/(m.s)", "mPa.s"]

[[list]]
category = "temperature"
units = ["K", "degC", "degF", "degR", "delta_K", "delta_degC", "delta_degF", "delta_degR"]

[[list]]
category = "compound"
units = ["m/s", "km/h", "kg/m3", "g/cm3", "lb/ft3", "N/m2", "J/(mol.K)", "kg.m2/s2", "W/(m2.K)", "mol/L", "kg/(m2.s)"]
