# Speed measurements: what is converted and how the batch inputs are made.
# Inputs: LCG32, x(n+1) = (1664525 x(n) + 1013904223) mod 2^32, v = x / 2^32 * 2000 - 1000.
# Every runner implements exactly this, so all libraries convert the same numbers.

[inputs]
generator = "lcg32"
seed = 12345
lo = -1000.0
hi = 1000.0
batch_sizes = [1000, 100000, 1000000]

[[conversion]]
id = "linear_speed"
from = "m/s"
to = "km/h"
oneshot = "10 m/s"

[[conversion]]
id = "linear_pressure"
from = "psi"
to = "kPa"
oneshot = "5 psi"

[[conversion]]
id = "affine_temperature"
from = "degC"
to = "degF"
oneshot = "20 degC"

[[conversion]]
id = "compound_cp"
from = "kJ/(kg.K)"
to = "Btu_IT/(lb.delta_degF)"
oneshot = "1 kJ/(kg.K)"
