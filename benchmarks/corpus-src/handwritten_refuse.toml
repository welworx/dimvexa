source = "NIST SP 811 App. B.8"
dimvexa_codes = ["ambiguous_symbol"]

[[case]]
id = "ref-007"
category = "ambiguous_name"
op = "convert"
value = "1"
from = "hp"
to = "W"
why = "mechanical 745.70 W versus metric 735.50 W (and electric 746 W)"
source = "NIST SP 811 App. B.8; DIN 66036"
dimvexa_codes = ["ambiguous_symbol"]

[[case]]
id = "ref-008"
category = "ambiguous_name"
op = "convert"
value = "1"
from = "mile"
to = "km"
why = "international mile versus US survey mile (about 3.2 mm per mile apart)"
source = "NIST SP 811 App. B.8"
dimvexa_codes = ["ambiguous_symbol"]

[[case]]
id = "ref-009"
category = "ambiguous_name"
op = "convert"
value = "1"
from = "foot"
to = "m"
why = "international foot versus US survey foot (2 ppm apart); only matters for geodetic work, listed because the request does not say which"
source = "NIST SP 811 App. B.8"
dimvexa_codes = ["ambiguous_symbol", "unknown_unit"]

[[case]]
id = "ref-010"
category = "ambiguous_name"
op = "convert"
value = "100"
from = "ppm"
to = "1"
why = "ppm may be by mass, by mole or by volume; the factor 1e-6 hides the basis"
source = "UCUM (ppm is a pure number); ISO 80000-1 discourages ppm"
dimvexa_codes = ["ambiguous_symbol"]

[[case]]
id = "ref-011"
category = "missing_context"
op = "convert"
value = "1"
from = "Nm3"
to = "m3"
why = "Nm3 is a volume at a stated reference state; converting to actual m3 needs the actual temperature and pressure (a factor must be supplied)"
source = "stated-reference units, no standard"
dimvexa_codes = ["dimension_mismatch", "refused"]

[[case]]
id = "ref-012"
category = "missing_context"
op = "convert"
value = "1"
from = "m3"
to = "Nm3"
why = "actual m3 to normal m3 needs the actual temperature and pressure"
source = "stated-reference units, no standard"
dimvexa_codes = ["dimension_mismatch", "refused"]

[[case]]
