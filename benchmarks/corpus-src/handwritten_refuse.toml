# Requests that a safe library must refuse or flag as ambiguous. Any error counts as a refusal;
# `dimvexa_codes` lists the Dimvexa error codes that would be the intended reason.

[[case]]
id = "ref-001"
category = "ambiguous_name"
op = "convert"
value = "1"
from = "ton"
to = "kg"
why = "ton is short (2000 lb), long (2240 lb) or metric (1000 kg): up to 10 percent apart"
source = "NIST HB 44 (2023) App. C; BIPM SI Brochure (tonne)"
dimvexa_codes = ["ambiguous_symbol"]

[[case]]
id = "ref-002"
category = "ambiguous_name"
op = "convert"
value = "1"
from = "gal"
to = "L"
why = "US gallon 3.785 L versus imperial gallon 4.546 L: 20 percent apart"
source = "NIST HB 44 (2023) App. C; UK Weights and Measures Act 1985"
dimvexa_codes = ["ambiguous_symbol"]

[[case]]
id = "ref-003"
category = "ambiguous_name"
op = "convert"
value = "1"
from = "oz"
to = "g"
why = "avoirdupois 28.35 g, troy 31.10 g (fluid ounces are volumes)"
source = "NIST SP 811 App. B.8"
dimvexa_codes = ["ambiguous_symbol"]

[[case]]
id = "ref-004"
category = "ambiguous_name"
op = "convert"
value = "1"
from = "pt"
to = "L"
why = "US pint, imperial pint, dry pint, and also the typographic point"
source = "NIST HB 44 (2023) App. C"
dimvexa_codes = ["ambiguous_symbol"]

[[case]]
id = "ref-005"
category = "ambiguous_name"
op = "convert"
value = "1"
from = "cal"
to = "J"
why = "thermochemical 4.184 J versus International Table 4.1868 J"
source = "NIST SP 811 App. B.8"
dimvexa_codes = ["ambiguous_symbol"]

[[case]]
id = "ref-006"
category = "ambiguous_name"
op = "convert"
value = "1"
from = "Btu"
to = "J"
