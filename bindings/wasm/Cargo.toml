# SPDX-License-Identifier: MIT OR Apache-2.0
# WASM binding (ADR-011). Own workspace (the empty [workspace] table below), NOT a member of the
# main workspace: it needs wasm-bindgen from crates.io, and the main workspace builds offline with
# std only (ADR-003). `cargo xtask ci` never builds it; see bindings/wasm/README.md.
[package]
name = "dimvexa-wasm"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "WebAssembly binding for Dimvexa (Node.js and browsers)"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dimvexa = { path = "../../crates/dimvexa" }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
