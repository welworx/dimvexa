# Python binding (PyO3 + maturin). Its own workspace: the main workspace is std-only and builds
# offline, and this crate needs PyO3 and NumPy from the registry. See README.md and ADR-012.
[package]
name = "dimvexa-python"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/welworx/dimvexa"
description = "Python binding for Dimvexa"
publish = false

[workspace]

[lib]
name = "_dimvexa"
crate-type = ["cdylib"]

[dependencies]
dimvexa = "0.5.0"
pyo3 = { version = "0.30", features = ["abi3-py39", "extension-module"] }
numpy = "0.30"

# LTO lets the PyO3 call trampolines inline across crates: about 57 ns to 48 ns per scalar call,
# measured 2026-11-08 (no effect on results). panic stays "unwind": PyO3 turns a panic into a
# Python exception, abort would kill the interpreter.
[profile.release]
lto = true
codegen-units = 1
